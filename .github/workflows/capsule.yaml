name: Capsule build/test
on:
  push:
  pull_request:
    paths:
      - contracts/**
      - lib/**
      - tests/**
      - deployment/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain
      - Cross.toml
      - .github/workflows/capsule.yaml

jobs:
  capsule-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debug
            cargo-option: ""
            target-dir: "build/debug"
            test-env: debug
          - target: testnet
            cargo-option: "--release"
            target-dir: "build/release"
            test-env: release
          - target: mainnet
            cargo-option: "--release --features release_export"
            target-dir: "build/release"
            test-env: release
    env:
      SPORE_DEPLOYMENT_MANIFEST: deployment/type-ids.fixture.toml
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      
      - name: Install the RISC-V Rust target
        run: rustup target add riscv64imac-unknown-none-elf

      - name: Build contracts in dependency order
        env:
          SPORE_BUILD_RUNNER: cargo
          CC_riscv64imac_unknown_none_elf: ${{ github.workspace }}/scripts/clang-riscv.sh
        run: ./scripts/build-contracts.sh ${{ matrix.cargo-option }}

      - name: Deployment plan tests
        run: cargo test --locked -p spore-build-tools --lib

      - name: Cluster Agent identity tests
        run: cargo test --locked -p cluster_agent

      - name: VM integration tests
        env:
          CAPSULE_TEST_ENV: ${{ matrix.test-env }}
          SPORE_TEST_CLUSTER_NETWORK: ${{ matrix.target == 'mainnet' && 'mainnet' || 'testnet' }}
        run: cargo test --locked --manifest-path tests/Cargo.toml

      - name: List all the contract binaries of ${{ github.ref }}
        run: ls -l ${{ matrix.target-dir }}

      - name: Archive the contract binaries ${{ github.sha }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-binaries-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/debug
            build/release
    outputs:
      spore-contract-ref: ${{ github.sha }}
  
  record-code-hash:
    needs: capsule-build-and-test
    strategy:
      matrix:
        target: [debug, testnet, mainnet]
    runs-on: ubuntu-24.04
    steps:
      # TODO: add this codehash util into the `tests` directory
      # or, simply use `ckb-cli util blake2b --binary-path ...` to get the codehash
      - name: Checkout a code_hash tool
        uses: actions/checkout@v4
        with:
          repository: Flouse/spore-contract
          ref: codehash-tool

      - uses: actions/download-artifact@v4
        with:
          name: contract-binaries-${{ matrix.target }}-${{ needs.capsule-build-and-test.outputs.spore-contract-ref }}
          path: build

      - name: Build codehash-tool
        working-directory: build
        run: cargo build

      - name: Record code_hash of contract binaries
        working-directory: build
        run: |
          echo "spore-contract-commit: ${{ needs.capsule-build-and-test.outputs.spore-contract-ref }}\n"
          ./target/debug/code_hash
