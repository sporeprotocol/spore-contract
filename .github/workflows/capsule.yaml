name: Capsule build/test
on:
  push:
  pull_request:
    paths:
      - contracts/**
      - lib/**
      - tests/**
      - scripts/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain
      - Cross.toml
      - .github/workflows/capsule.yaml

jobs:
  capsule-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debug
            cargo-option: ""
            target-dir: "build/debug"
            test-env: debug
          - target: testnet
            cargo-option: "--release"
            target-dir: "build/release"
            test-env: release
          - target: mainnet
            cargo-option: "--release --features release_export"
            target-dir: "build/release"
            test-env: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cross
        run: cargo install cross --version 0.2.5 --locked

      - name: Build contracts in dependency order
        run: ./scripts/build-contracts.sh ${{ matrix.cargo-option }}

      - name: VM integration tests
        env:
          CAPSULE_TEST_ENV: ${{ matrix.test-env }}
        run: cargo test --locked --manifest-path tests/Cargo.toml

      - name: Native invocation ABI tests
        run: cargo test --locked -p spore-mutant --lib

      - name: List all the contract binaries of ${{ github.ref }}
        run: ls -l ${{ matrix.target-dir }}

      - name: Archive the contract binaries ${{ github.sha }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-binaries-${{ matrix.target }}-${{ github.sha }}
          path: |
            build/debug
            build/release
    outputs:
      spore-contract-ref: ${{ github.sha }}
  
  record-code-hash:
    needs: capsule-build-and-test
    strategy:
      matrix:
        target: [debug, testnet, mainnet]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository code-hash tool
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: contract-binaries-${{ matrix.target }}-${{ needs.capsule-build-and-test.outputs.spore-contract-ref }}
          path: build

      - name: Record code_hash of contract binaries
        run: |
          echo "spore-contract-commit: ${{ needs.capsule-build-and-test.outputs.spore-contract-ref }}\n"
          python3 scripts/code-hashes.py build
