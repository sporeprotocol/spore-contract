[workspace]
resolver = "2"
members = [
    "lib/types",
    "lib/utils",
    "lib/errors",
    "lib/build",
    "lib/mutant",

    "contracts/spore",
    "contracts/cluster",
    "contracts/cluster_proxy",
    "contracts/cluster_agent",
    "contracts/spore_extension_lua",
    "contracts/spore_extension_rust",
    "contracts/mutant_equipment",
    "tests/fixtures/mutant_probe",
]
exclude = ["tests"]

# ELF files stored in native Mutant cells must not carry multi-megabyte DWARF.
# Contract debug assertions and CKB debug output remain enabled.
[profile.dev]
strip = true

[profile.release]
overflow-checks = true
strip = true
opt-level = 's'
lto = true
codegen-units = 1
